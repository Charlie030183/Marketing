<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cline ASCII Head — standalone</title>
<style>
html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;font-family:ui-monospace,monospace}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#hud{position:absolute;left:12px;top:12px;z-index:20;font-size:12px;opacity:.8}
#error{position:absolute;left:12px;bottom:12px;z-index:30;color:#ff6b6b;font:12px ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
 <div id="hud">ASCII head — base original cline.dae<br>charset " .:-=+*#%@" · resolution 0.22</div>
 <div id="error"></div>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap=document.getElementById('wrap');
const err=document.getElementById('error');
try{
 const width=wrap.clientWidth,height=wrap.clientHeight;
 const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(45,width/height,.1,1000);
 camera.position.set(0,.2,3.2);

 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
 renderer.setSize(width,height);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 renderer.setClearColor(0x000000,0);

 const effect=new AsciiEffect(renderer,' .:-=+*#%@',{resolution:.22,scale:1,color:false,alpha:true,block:false,invert:false});
 effect.setSize(width,height);
 effect.domElement.style.color='#fff';
 effect.domElement.style.backgroundColor='transparent';
 wrap.appendChild(effect.domElement);

 const controls=new OrbitControls(camera,effect.domElement);
 controls.enableDamping=true;

 scene.add(new THREE.AmbientLight(0xffffff,.5));
 const dir=new THREE.DirectionalLight(0xffffff,1);dir.position.set(10,10,5);scene.add(dir);
 const point=new THREE.PointLight(0xffffff,.5);point.position.set(-10,-10,-5);scene.add(point);

 const root=new THREE.Group();
 root.rotation.set(-.15,-.3,0);
 root.position.set(0,-.5,0);
 scene.add(root);

 const loader=new ColladaLoader();
 loader.load('https://cline.bot/assets/3d/cline.dae',(collada)=>{
   const model=collada.scene;
   model.scale.set(.015,.015,.015);
   model.rotation.set(-Math.PI/2,0,0);
   model.position.set(0,0,0);
   root.add(model);
   err.textContent='';
 },undefined,(e)=>{
   console.error(e);
   err.textContent='Falha ao carregar cline.dae do cline.bot.\n'+(e?.message||e);
 });

 function tick(){
   requestAnimationFrame(tick);
   root.rotation.y+=.004;
   controls.update();
   effect.render(scene,camera);
 }
 tick();

 addEventListener('resize',()=>{
   const w=wrap.clientWidth,h=wrap.clientHeight;
   camera.aspect=w/h;camera.updateProjectionMatrix();
   renderer.setSize(w,h);effect.setSize(w,h);
 });
}catch(e){
 console.error(e);
 err.textContent='Erro JavaScript: '+(e?.message||e);
}
</script>
</body>
</html>
