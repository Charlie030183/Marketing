function b64bytes(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
const raw=await new Response(new Blob([b64bytes(DATA)]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
const dv=new DataView(raw);
let off=0;
const triCount=dv.getUint32(off,true); off+=4;
const mn=[dv.getFloat32(off,true),dv.getFloat32(off+4,true),dv.getFloat32(off+8,true)]; off+=12;
const mx=[dv.getFloat32(off,true),dv.getFloat32(off+4,true),dv.getFloat32(off+8,true)]; off+=12;
const whiteP=[],whiteN=[],blackP=[],blackN=[];
for(let t=0;t<triCount;t++){
  const pp=[],nn=[];
  for(let i=0;i<9;i++){pp.push(dv.getUint16(off,true));off+=2}
  for(let i=0;i<9;i++){nn.push(dv.getInt8(off)/127);off++}
  const mat=dv.getUint8(off++);
  const P=mat?blackP:whiteP,N=mat?blackN:whiteN;
  for(let v=0;v<3;v++){
    for(let k=0;k<3;k++)P.push(mn[k]+(pp[v*3+k]/65535)*(mx[k]-mn[k]));
    N.push(nn[v*3],nn[v*3+1],nn[v*3+2]);
  }
}

const wrap=document.getElementById('wrap');
const canvas=document.getElementById('c');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,.1,1000);
camera.position.set(.01,-.21,1.18);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const effect=new AsciiEffect(renderer,' .:-=+*#%@',{resolution:.22,scale:1,color:false,alpha:true,block:false,invert:false});
effect.domElement.style.color='#000';
effect.domElement.style.backgroundColor='transparent';
canvas.style.display='none';
wrap.appendChild(effect.domElement);

scene.add(new THREE.AmbientLight(0xffffff,.5));
const dl=new THREE.DirectionalLight(0xffffff,1); dl.position.set(10,10,5); scene.add(dl);
const pl=new THREE.PointLight(0xffffff,.5); pl.position.set(-10,-10,-5); scene.add(pl);

function mesh(P,N,color){
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
 g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
 return new THREE.Mesh(g,new THREE.MeshLambertMaterial({color}));
}
const model=new THREE.Group();
model.add(mesh(whiteP,whiteN,0xffffff),mesh(blackP,blackN,0x000000));
model.scale.set(.015,.015,.015);
model.rotation.set(-Math.PI/2,0,0);

const root=new THREE.Group();
root.rotation.set(-.15,-.3,0);
root.position.set(0,-.5,0);
root.add(model);
scene.add(root);

const controls=new OrbitControls(camera,effect.domElement);
controls.enablePan=false; controls.enableZoom=false; controls.enableRotate=true; controls.enableDamping=true; controls.dampingFactor=.4;
controls.target.set(0,-.25,0);
const home={azimuth:controls.getAzimuthalAngle(),polar:controls.getPolarAngle()};
const lim={minA:home.azimuth-.175,maxA:home.azimuth+.175,minP:home.polar-.175,maxP:home.polar+.175};
controls.minAzimuthAngle=home.azimuth-.262; controls.maxAzimuthAngle=home.azimuth+.262;
controls.minPolarAngle=home.polar-.262; controls.maxPolarAngle=home.polar+.262;

const mouse={x:0,y:0};
window.addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1)});

const chars=['<','/','>','*','&','%','$','#'];
const trails=chars.map((ch,index)=>({index,particles:[],meshes:[],max:119+Math.floor(42*Math.random()),aging:.003+.002*Math.random(),color:Math.random()>.5?0x6b7280:0x374151}));
const clock=new THREE.Clock();

function resize(){
 const w=wrap.clientWidth||innerWidth,h=wrap.clientHeight||500;
 camera.aspect=w/h; camera.updateProjectionMatrix();
 renderer.setSize(w,h); effect.setSize(w,h);
}
addEventListener('resize',resize); resize();

function updateTrails(t){
 const total=trails.length;
 for(const r of trails){
  const a=r.index/total*Math.PI*2+.3*t;
  const x=.6*Math.cos(a),z=.6*Math.sin(a),y=.4*Math.sin(.15*t+r.index/total*Math.PI*2);
  if(t%.04<.016){
   const size=.008+.012*Math.random();
   const g=new THREE.SphereGeometry(size,6,6);
   const m=new THREE.MeshStandardMaterial({color:r.color,transparent:true,opacity:.8});
   const s=new THREE.Mesh(g,m); s.position.set(x,y,z); root.add(s); r.meshes.push(s); r.particles.push({age:0});
   if(r.particles.length>r.max){r.particles.shift();const old=r.meshes.shift();root.remove(old);old.geometry.dispose();old.material.dispose()}
  }
  for(let i=r.particles.length-1;i>=0;i--){
   const p=r.particles[i],s=r.meshes[i]; p.age+=r.aging;
   if(p.age>=1){root.remove(s);s.geometry.dispose();s.material.dispose();r.particles.splice(i,1);r.meshes.splice(i,1)}
   else{const q=1-p.age;s.scale.setScalar(q);s.material.opacity=.8*q}
  }
 }
}
function follow(){
 const a=Math.max(lim.minA,Math.min(lim.maxA,home.azimuth-mouse.x*((lim.maxA-lim.minA)/2)*.5));
 const p=Math.max(lim.minP,Math.min(lim.maxP,home.polar+mouse.y*((lim.maxP-lim.minP)/2)*.5));
 const s=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
 s.theta=THREE.MathUtils.lerp(s.theta,a,.05); s.phi=THREE.MathUtils.lerp(s.phi,p,.05);
 camera.position.copy(new THREE.Vector3().setFromSpherical(s).add(controls.target));
}
function tick(){
 requestAnimationFrame(tick);
 updateTrails(clock.getElapsedTime());
 follow();
 controls.update();
 effect.render(scene,camera);
}
tick();
</script>
