<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenAntics — Acesso Restrito</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3;font-family:system-ui,"Segoe UI",sans-serif}.card{width:min(560px,calc(100% - 28px));border:1px solid #30363d;background:#161b22;border-radius:18px;padding:28px}.muted{color:#8b949e;line-height:1.6}.button{display:inline-block;margin-top:12px;border:1px solid #30363d;background:#1f6feb;color:white;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.hidden{display:none}.country{padding:10px 0;border-bottom:1px solid #30363d}.cities{margin:8px 0 0 18px;color:#8b949e}</style></head><body>
<div class="card"><h1>Configurações Avançadas do Desenvolvedor</h1><p class="muted" id="status">Acesso Restrito. Autenticação Google necessária.</p><button class="button" id="login">Entrar com Google</button><div id="panel" class="hidden"><h2>Instalações</h2><div id="data"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const cfg=window.SCREENANTICS_SUPABASE||{};const status=document.getElementById("status"),login=document.getElementById("login"),panel=document.getElementById("panel"),data=document.getElementById("data");
if(!cfg.url||!cfg.anonKey){login.onclick=()=>status.textContent="Acesso Restrito. O serviço privado ainda não foi ativado."; }
else{const sb=supabase.createClient(cfg.url,cfg.anonKey);login.onclick=async()=>{await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}})};async function load(){const {data:userData}=await sb.auth.getUser();const user=userData&&userData.user;if(!user)return;const {data:rows,error}=await sb.rpc("developer_installation_summary");if(error){status.textContent="Acesso Restrito";return}status.textContent="Acesso autorizado";login.classList.add("hidden");panel.classList.remove("hidden");const groups={};for(const r of rows||[]){(groups[r.country]??=[]).push(r)}data.innerHTML=Object.entries(groups).map(([country,rs])=>'<div class="country"><strong>'+country+' ('+rs.reduce((a,x)=>a+Number(x.installations),0)+')</strong><div class="cities">'+rs.map(x=>x.city+' ('+x.installations+')').join('<br>')+'</div></div>').join("")}load()}
</script></body></html>
